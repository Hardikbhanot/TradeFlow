<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Titanium Tile Background -->
  <rect width="64" height="64" rx="16" fill="#0F1218"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
  
  <defs>
    <linearGradient id="amberGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="60%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.3"/>
      <stop offset="100%" stopColor="#F59E0B" stopOpacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="20" fill="url(#glowGrad)"/>

  <!-- Geometric "T" and Upward Kinetic Trade Bars -->
  <!-- Bar 1: Lower Left -->
  <rect x="15" y="34" width="7" height="15" rx="3" fill="#64748B" opacity="0.8"/>
  
  <!-- Bar 2: Center Middle -->
  <rect x="26" y="24" width="7" height="25" rx="3" fill="url(#amberGrad)"/>
  
  <!-- Bar 3: Right Peak -->
  <rect x="37" y="14" width="7" height="35" rx="3" fill="url(#amberGrad)"/>

  <!-- Upward Trend Accent Beam -->
  <path d="M18 32 L29 21 L41 12" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Peak Signal Node -->
  <circle cx="41" cy="12" r="3.5" fill="#22C55E"/>
</svg>